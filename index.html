<!doctype html>
<html lang="en" class="dark agent-swarm-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // 1. Immediately reset scroll to top on entry/refresh so site opens at Hero, not #about or #projects
      try {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        if (window.location.hash && window.location.hash !== '#top') {
          history.replaceState(null, '', window.location.pathname);
        }
        window.scrollTo(0, 0);
      } catch (e) {}

      // 2. Immediate reduced-motion & JS safety check before first paint
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.remove('agent-swarm-active');
        }
      } catch (e) {}
    </script>
    <title>Nilesh — 3D Cybersecurity &amp; Data Science Portfolio | GoKaliFree</title>
    <meta
      name="description"
      content="Interactive 3D portfolio of Nilesh, Computer Science (B.C.S.) &amp; M.Sc. Data Science student in Maharashtra, India. Creator of GoKaliFree (gokalifree.in)."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nilesh — 3D Cybersecurity &amp; Data Science Portfolio | GoKaliFree" />
    <meta
      property="og:description"

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Agent Swarm: pre-paint hiding of unbuilt targets so agents can build them piece by piece -->
    <style id="agent-swarm-preload">
      html.agent-swarm-active [data-swarm-target]:not([data-agent-active]) {
        opacity: 0 !important;
        visibility: hidden !important;
        transition: none !important;
      }
      html.agent-swarm-active .agent-char:not([data-char-revealed]) {
        opacity: 0 !important;
        visibility: hidden !important;
        display: inline;
      }
      html.agent-swarm-active .agent-char[data-char-revealed] {
        opacity: 1 !important;
        visibility: visible !important;
        display: inline;
      }
      .agent-char {
        display: inline;
      }
      .agent-word {
        display: inline-block;
        white-space: nowrap;
      }
    </style>
    <noscript>
      <style>
        html.agent-swarm-active [data-swarm-target] {
          opacity: 1 !important;
          visibility: visible !important;
        }
        html.agent-swarm-active .agent-char {
          opacity: 1 !important;
          visibility: visible !important;
        }
      </style>
    </noscript>
